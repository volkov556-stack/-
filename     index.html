const bank=window.QUESTION_BANK;const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const sizes=[21,21,20,20,20,20,20,20,20,20];let tickets=[],p=0;sizes.forEach((n,i)=>{tickets.push({number:i+1,questions:bank.slice(p,p+n)});p+=n});
let quiz=[],idx=0,correct=0,answered=false,mistakes=[],activeTicket=null,mode='ticket';
function renderTickets(){const progress=load('apro_v5_ticket_progress',{});$('ticketList').innerHTML=tickets.map(t=>{const r=progress[t.number];const txt=r?`${r.correct}/${t.questions.length}`:`0/${t.questions.length}`;return `<button class="ticket ${r&&r.correct===t.questions.length?'done':''}" data-ticket="${t.number}"><span><b>Lístek ${t.number}</b><small>${t.questions.length} otázek</small></span><span class="score">${txt}</span></button>`}).join('');document.querySelectorAll('.ticket').forEach(b=>b.onclick=()=>startTicket(+b.dataset.ticket))}
function prepare(arr){return arr.map(x=>({...x,options:shuffle(x.options)}))}
function startTicket(n){activeTicket=n;mode='ticket';quiz=prepare(tickets[n-1].questions);startQuiz(`Lístek ${n}`)}
function startQuiz(label){idx=0;correct=0;mistakes=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('ticketName').textContent=label;render()}
$('randomBtn').onclick=()=>{activeTicket=null;mode='random';quiz=prepare(shuffle(bank).slice(0,20));startQuiz('Náhodný test')};
$('mistakesBtn').onclick=()=>{const ids=load('apro_v5_errors',[]);const pool=bank.filter(q=>ids.includes(q.id));if(!pool.length)return alert('Zatím nejsou uložené žádné chyby.');activeTicket=null;mode='mistakes';quiz=prepare(pool);startQuiz('Jen chyby')};
function render(){answered=false;const q=quiz[idx];$('counter').textContent=`Otázka ${idx+1} / ${quiz.length}`;$('bar').style.width=`${idx/quiz.length*100}%`;$('question').textContent=q.question;$('feedback').textContent='';$('nextBtn').disabled=true;$('options').innerHTML='';q.options.forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=()=>choose(b,opt);$('options').appendChild(b)})}
function choose(btn,opt){if(answered)return;answered=true;const q=quiz[idx],ok=opt===q.answer;if(ok)correct++;else mistakes.push(q);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=ok?'Správně!':'Nesprávně. Správná odpověď je označena zeleně.';$('feedback').className='feedback '+(ok?'ok':'bad');$('nextBtn').disabled=false}
$('nextBtn').onclick=()=>idx<quiz.length-1?(idx++,render()):finish();$('quitBtn').onclick=()=>{if(confirm('Ukončit test?'))finish()};
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(correct/quiz.length*100);$('score').textContent=`${correct}/${quiz.length}`;$('percent').textContent=pct+'%';$('wrong').textContent=mistakes.length;$('grade').textContent=pct>=80?'Výborně':pct>=60?'Dobře':'Procvičit';if(mode==='ticket'&&activeTicket){const prog=load('apro_v5_ticket_progress',{});const old=prog[activeTicket];if(!old||correct>old.correct)prog[activeTicket]={correct,total:quiz.length,percent:pct};save('apro_v5_ticket_progress',prog)}let ids=load('apro_v5_errors',[]),wrongIds=new Set(mistakes.map(x=>x.id)),answeredIds=new Set(quiz.map(x=>x.id));ids=ids.filter(id=>!answeredIds.has(id)||wrongIds.has(id));for(const id of wrongIds)if(!ids.includes(id))ids.push(id);save('apro_v5_errors',ids);$('review').innerHTML=mistakes.length?'<h3>Chybné odpovědi</h3>'+mistakes.map(x=>`<div class="reviewitem"><b>${esc(x.question)}</b><br><span class="ok">${esc(x.answer)}</span></div>`).join(''):'<p class="ok"><b>Bez chyb.</b></p>'}
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden');renderTickets()};$('retryBtn').onclick=()=>{if(!mistakes.length)return alert('V tomto testu nebyly chyby.');quiz=prepare(mistakes);idx=0;correct=0;mistakes=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('ticketName').textContent='Opakování chyb';render()};renderTickets();if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister())));if('caches' in window)caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
