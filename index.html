<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Aprobační trenažér</title><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=3"></head><body><main class="app">
<section id="home" class="card"><div class="top"><div><div class="eyebrow">MEDICÍNA • VERZE 3 • 202 OTÁZEK</div><h1>Aprobační trenažér</h1></div><button id="themeBtn" class="iconbtn" aria-label="Téma">◐</button></div><p class="muted">Otázky a správné odpovědi jsou převzaty přesně z dodaného souboru.</p><div class="stats"><div><b id="best">—</b><span>Nejlepší výsledek</span></div><div><b id="saved">0</b><span>Uložené chyby</span></div></div><div class="seg"><button class="modebtn active" data-mode="learn">Trénink</button><button class="modebtn" data-mode="exam">Zkouška</button><button class="modebtn" data-mode="mistakes">Jen chyby</button></div><label>Počet otázek<select id="count"><option>10</option><option>20</option><option selected>50</option><option>100</option><option>202</option></select></label><label>Časový limit<select id="time"><option value="0" selected>Bez limitu</option><option value="15">15 minut</option><option value="30">30 minut</option><option value="60">60 minut</option></select></label><button id="startBtn" class="primary">Začít</button></section>
<section id="quiz" class="card hidden"><div class="quizhead"><span id="counter"></span><b id="timer"></b></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback"></div><div id="source" class="source hidden"></div><div class="actions"><button id="quitBtn" class="secondary">Ukončit</button><button id="nextBtn" class="primary" disabled>Další</button></div></section>
<section id="result" class="card hidden"><div class="eyebrow">VÝSLEDEK</div><h1 id="grade"></h1><div class="resultgrid"><div><b id="score"></b><span>Správně</span></div><div><b id="percent"></b><span>Úspěšnost</span></div><div><b id="wrong"></b><span>Chyby</span></div></div><div id="review"></div><div class="actions"><button id="againBtn" class="secondary">Domů</button><button id="retryBtn" class="primary">Opakovat chyby</button></div></section>
</main><script src="data.js?v=3"></script><script src="app.js?v=3"></script></body></html>
